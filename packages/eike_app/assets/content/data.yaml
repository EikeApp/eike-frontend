---
data:
  flyer:
    tips:
      - id: 0
        position: 1
        title: Bewege Dich mehr als sonst!
        description: >
          Stress versorgt uns mit viel Energie für Notfälle. Gib Deinem Körper die Möglichkeit, diese Energie hinterher
          wieder loszuwerden. Bewege Dich mehr als sonst! Je länger, desto besser: Spazierengehen, Radfahren, Laufen,
          Rudern, …
        question: Wie wirst Du Dich mehr bewegen?
        icon:
          src: "./7-things/bewege-dich.png"
          alt: >
            Eine laufende Figure – eine grüne Hälfte symbolisiert steigende Energie, eine rote Hälfte sinkenden Stress.
      - id: 1
        position: 2
        title: Gönne Dir etwas nur meide Alkohol und Drogen!
        description: >
          Alkohol und Drogen betäuben Gedanken und Gefühle. Sie behindern das Gehirn aber auch bei der Verarbeitung von
          Stress und Belastungen. Lässt ihre Wirkung nach, geht alles wieder von vorne los. Darum meide Alkohol und
          Drogen! Gönne Dir etwas: ein großes Eis, einen freien Nachmittag, einen Kinobesuch, …
        question: Was wirst du Dir gönnen?
        icon:
          src: "./7-things/bleib-nuechtern.png"
          alt: >
            Figur mit ausgestreckten Armen im Sprung nach vorne. Im Hintergrund ein roter Mülleimer mit offenem Deckel
            gefüllt mit zwei Glasflaschen.
      - id: 2
        position: 3
        title: Suche Ruhe und Sicherheit!
        description: >
          Starker Stress und hohe Einsatzbelastungen sind anstrengend und machen unruhig und unsicher.
          Ruhe und Sicherheit gibt es an einem ruhigen Ort, zu einer bestimmten Zeit, bei einer Tätigkeit, mit
          bestimmten Menschen, …
        question: Wo wirst Du Ruhe und Sicherheit finden?
        icon:
          src: "./7-things/suche-ruhe.png"
          alt: Eine Figur sitzt auf einem grünen Haken und entspannt mit den Händen hinter dem Kopf.
      - id: 3
        position: 4
        title: Bekomme etwas fertig!
        description: >
          Manchmal entsteht nach belastenden Einsätzen das Gefühl von Hilflosigkeit und Kontrollverlust. Um Dich wieder
          handlungsfähig zu fühlen, kannst Du etwas reparieren, etwas aufräumen, etwas sauber machen, etwas
          verbessern, etwas …
        question: Was wirst Du fertig bekommen?
        icon:
          src: "./7-things/bekomme-etwas-fertig.png"
          alt: >
            Figur setzt ein grünes Häkchen in das oberste von drei übereinander stehenden Kästen. Die unteren zwei sind
            bereits abgehakt.
      - id: 4
        position: 5
        title: Triff Dich mit anderen!
        description: >
          Stress und Belastungen können einsam machen. Soziale Kontakte machen uns dagegen stärker. Darum triff Dich
          mit anderen: Zum Essen, zum Schnacken, zu zum Sporttreiben, zum Arbeiten, …
        question: Wen wirst Du treffen?
        icon:
          src: "./7-things/triff-dich.png"
          alt: Zwei Figuren, die sich mit einem Abklatschen begrüßen.
      - id: 5
        position: 6
        title: Plane etwas, worauf Du Dich freust!
        description: >
          Auch nach belastenden Einsätzen geht Dein Leben weiter. Stärke Deine Zuversicht, indem Du etwas Schönes
          planst. Einen Ausflug, eine Anschaffung, den nächsten Urlaub, Deinen Geburtstag, …
        question: Was wirst Du planen?
        icon:
          src: "./7-things/plane-etwas.png"
          alt: Figur zeigt mit erhobener Hand nach vorne, im Hintergrund ein Terminplaner.
      - id: 6
        position: 7
        title: Du kannst Dir Unterstützung holen!
        description: >
          Wenn Stress und Belastung nicht weniger werden, ist Dein Einsatznachsorgeteam für Dich erreichbar. Tu das
          auf jeden Fall, wenn es Dir nach vier Wochen noch nicht wieder gut geht!
        icon:
          src: "./7-things/unterstuetzung-holen.png"
          alt: Eine Figur hilft einer anderen über eine Mauer.
