[changelog]
header = ""
body = """
{% if version %}\
## {{ version }} {% if timestamp %}({{ timestamp | date(format="%Y-%m-%d") }}){% endif %}
{% else %}\
## Unreleased
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
### {{ group }}
{% for commit in commits %}
- {{ commit.message | capitalize }} ([{{ commit.id | truncate(length=7, end="") }}](https://github.com/EikeApp/eike-frontend/commit/{{ commit.id }}))
{%- endfor %}
{% endfor %}\n
"""
footer = ""
trim = true

[git]
conventional_commits = false
filter_unconventional = false
commit_parsers = [
  { message = "(?i)^feat|add|neu|new|hinzugef", group = "✨ Neue Features" },
  { message = "(?i)^fix|bug|behoben|hotfix",    group = "🐛 Bugfixes" },
  { message = "(?i)^perf|optim|speed",           group = "⚡ Performance" },
  { message = "(?i)^refactor|umbau|cleanup",     group = "♻️ Refactoring" },
  { message = "(?i)^doc|readme",                 group = "📝 Dokumentation" },
  { message = "(?i)^test|spec",                  group = "🧪 Tests" },
  { message = "(?i)^ci|build|pipeline",          group = "🔧 CI / Build" },
  { message = ".*",                              group = "🔀 Sonstiges" },
]
filter_commits = false
tag_pattern = ".*"
