name: Flutter Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 0.8.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          cache: true
      - run: flutter pub get
      - name: Verify pubspec version
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f1)
          if [ "$PUBSPEC_VERSION" != "${{ inputs.version }}" ]; then
            echo "pubspec.yaml version ($PUBSPEC_VERSION) does not match workflow version (${{ inputs.version }})"
            exit 1
          fi
      - name: Ensure tag does not exist
        run: |
          git fetch --tags
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ inputs.version }} already exists"
            exit 1
          fi
      - run: flutter analyze
      - run: flutter test ./packages/* --reporter github

  build-appbundle:
    name: Build Appbundle (AAB)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          cache: true
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > packages/eike_app/android/app/release.keystore
      - name: Create key.properties
        run: |
          cat > packages/eike_app/android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
      - name: Build AAB
        run: |
          cd packages/eike_app
          flutter build appbundle \
            --release \
            --build-name=${{ inputs.version }} \
            --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: packages/eike_app/build/app/outputs/bundle/release/app-release.aab
      - name: Remove keystore from disk
        if: always()
        run: rm -f packages/eike_app/android/app/release.keystore packages/eike_app/android/key.properties

  build-apk:
    name: Build Android-Package (APK)
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          cache: true
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > packages/eike_app/android/app/release.keystore
      - name: Create key.properties
        run: |
          cat > packages/eike_app/android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
      - name: Build APK
        run: |
          cd packages/eike_app
          flutter build apk \
            --release \
            --build-name=${{ inputs.version }} \
            --build-number=${{ github.run_number }}
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: packages/eike_app/build/app/outputs/flutter-apk/app-release.apk
      - name: Remove keystore from disk
        if: always()
        run: rm -f packages/eike_app/android/app/release.keystore packages/eike_app/android/key.properties

  build-ios:
    name: Build iOS IPA
    needs: validate
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          cache: true

      - name: Install Certificate
        uses: apple-actions/import-codesign-certs@v3
        with:
          p12-file-base64: ${{ secrets.IOS_P12 }}
          p12-password: ${{ secrets.IOS_P12_PASSWORD }}

      - name: Install Provisioning Profile
        uses: apple-actions/download-provisioning-profiles@v2
        with:
          bundle-id: com.example.app
          issuer-id: ${{ secrets.APPSTORE_ISSUER_ID }}
          api-key-id: ${{ secrets.APPSTORE_KEY_ID }}
          api-private-key: ${{ secrets.APPSTORE_PRIVATE_KEY }}

      - name: Build IPA
        run: |
          cd packages/eike_app
          flutter pub get # NOTE(Felix): This should probably be removed
          flutter build ipa \
            --release \
            --build-name=${{ inputs.version }} \
            --build-number=${{ github.run_number }}
      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: packages/eike_app/build/ios/ipa/*.ipa
      - name: Cleanup signing files
        if: always()
        run: |
          rm -f certificate.p12
          rm -f ~/Library/MobileDevice/Provisioning\ Profiles/app.mobileprovision

  release:
    name: Create Release
    needs:
      - build-apk
      - build-ios

    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag v${{ inputs.version }}
          git push origin v${{ inputs.version }}
      - name: Install git-cliff
        uses: kenji-miyake/setup-git-cliff@v2
      - name: Generate changelog
        run: |
          git fetch --tags
          git-cliff --latest --output CHANGELOG.md
      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: artifacts
      - name: Download IPA artifact
        uses: actions/download-artifact@v4
        with:
          name: release-ipa
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body_path: CHANGELOG.md
          files: |
            artifacts/app-release.apk
            artifacts/*.ipa

