name: Flutter Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 0.8.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          cache: true
      - run: flutter pub get
      - name: Verify pubspec version
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f1)
          if [ "$PUBSPEC_VERSION" != "${{ inputs.version }}" ]; then
            echo "pubspec.yaml version ($PUBSPEC_VERSION) does not match workflow version (${{ inputs.version }})"
            exit 1
          fi
      - name: Ensure tag does not exist
        run: |
          git fetch --tags
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ inputs.version }} already exists"
            exit 1
          fi
      - run: flutter analyze
      - run: flutter test ./packages/*

  build-android:
    name: Build Android
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          cache: true
      - run: flutter pub get
      - name: Build APK
        run: |
          cd packages/eike_app
          flutter build apk --release
      - name: Build AAB
        run: |
          cd packages/eike_app
          flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: release-apk
          path: packages/eike_app/build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: packages/eike_app/build/app/outputs/bundle/release/app-release.aab

  build-ios:
    name: Build iOS
    needs: validate
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          cache: true
      - run: flutter pub get
      - name: Build iOS
        run: |
          cd packages/eike_app
          flutter build ios --release --no-codesign
      - name: Create unsigned IPA
        run: |
          mkdir Payload
          cp -R packages/eike_app/build/ios/iphoneos/Runner.app Payload/
          zip -r app-release-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: release-ipa
          path: app-release-unsigned.ipa

  release:
    name: Create Release
    needs:
      - build-android
      - build-ios
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag v${{ inputs.version }}
          git push origin v${{ inputs.version }}
      - name: Install git-cliff
        run: |
          curl -sSL https://github.com/orhun/git-cliff/releases/latest/download/git-cliff-x86_64-unknown-linux-gnu.tar.gz | tar -xz
          sudo mv git-cliff-*/git-cliff /usr/local/bin/
      - name: Generate changelog
        run: |
          git fetch --tags
          git-cliff --latest --output CHANGELOG.md
      - uses: actions/download-artifact@v4
        with:
          name: release-apk
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: release-aab
          path: artifacts
      - uses: actions/download-artifact@v4
        with:
          name: release-ipa
          path: artifacts
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body_path: CHANGELOG.md
          files: |
            artifacts/app-release.apk
            artifacts/app-release.aab
            artifacts/app-release-unsigned.ipa
