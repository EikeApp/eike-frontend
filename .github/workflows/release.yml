name: Flutter Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: Release version (e.g. 0.8.1)
        required: true
        type: string

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          cache: true
      - run: flutter pub get
      - name: Verify pubspec version
        run: |
          PUBSPEC_VERSION=$(grep '^version:' pubspec.yaml | awk '{print $2}' | cut -d '+' -f1)
          if [ "$PUBSPEC_VERSION" != "${{ inputs.version }}" ]; then
            echo "pubspec.yaml version ($PUBSPEC_VERSION) does not match workflow version (${{ inputs.version }})"
            exit 1
          fi
      - name: Ensure tag does not exist
        run: |
          git fetch --tags
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "Tag v${{ inputs.version }} already exists"
            exit 1
          fi
      - run: flutter analyze
      - run: flutter test ./packages/*

  build-android:
    name: Build Android
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Decode Keystore
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 --decode > packages/eike_app/android/app/release.keystore
      - name: Create key.properties
        run: |
          cat > packages/eike_app/android/key.properties <<EOF
          storeFile=release.keystore
          storePassword=${{ secrets.KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.KEY_ALIAS }}
          keyPassword=${{ secrets.KEY_PASSWORD }}
          EOF
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          cache: true
      - run: flutter pub get
      - name: Build AAB
        run: |
          cd packages/eike_app
          flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: release-aab
          path: packages/eike_app/build/app/outputs/bundle/release/app-release.aab

  release:
    name: Create Release
    needs: build-android
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Create Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag v${{ inputs.version }}
          git push origin v${{ inputs.version }}
      - name: Install git-cliff
        uses: kenji-miyake/setup-git-cliff@v2
      - name: Generate changelog
        run: |
          git fetch --tags
          git-cliff --latest --output CHANGELOG.md
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ inputs.version }}
          name: v${{ inputs.version }}
          body_path: CHANGELOG.md

  deploy-android:
    name: Deploy to Google Play (internal)
    needs: release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-aab
          path: artifacts
      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.GOOGLE_PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: de.dfpsnv.eike
          releaseFiles: artifacts/app-release.aab
          track: internal
          status: completed
