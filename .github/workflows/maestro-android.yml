name: E2E (Maestro Android)

on:
  pull_request:
  push:
    branches: [ main ]
  workflow_dispatch:

permissions:
  contents: read
  checks: write

jobs:
  maestro-android:
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - name: Enable KVM (faster emulator)
        run: |
          sudo apt-get update
          sudo apt-get install -y qemu-kvm
          sudo usermod -aG kvm $USER
          sudo chown -R $USER /dev/kvm

      - name: Install deps (curl, unzip)
        run: |
          sudo apt-get update
          sudo apt-get install -y curl unzip

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter dependencies
        run: flutter pub get

      - name: Build APK
        run: |
          make build-apk
          ls -lah build/app/outputs/flutter-apk || true
          test -f build/app/outputs/flutter-apk/app-release.apk

      # Cache Maestro install (saves time + avoids flaky downloads)
      - name: Cache Maestro
        uses: actions/cache@v4
        with:
          path: ~/.maestro
          key: ${{ runner.os }}-maestro-2.0.10

      - name: Install Maestro CLI (retry + fallback) + PATH fix
        env:
          MAESTRO_VERSION: "2.0.10"
        run: |
          set -euo pipefail

          if [ -x "$HOME/.maestro/bin/maestro" ]; then
            echo "Maestro already cached."
          else
            echo "Trying official install script..."
            if ! curl -fsSL --retry 6 --retry-all-errors --retry-delay 5 "https://get.maestro.mobile.dev" | bash; then
              echo "Install script failed (possible 502). Fallback to GitHub release zip..."
              mkdir -p "$HOME/.maestro"
              curl -fsSL -o /tmp/maestro.zip \
                "https://github.com/mobile-dev-inc/maestro/releases/download/cli-${MAESTRO_VERSION}/maestro.zip"
              unzip -q /tmp/maestro.zip -d "$HOME/.maestro"
            fi
          fi

          # Make maestro available in THIS step (non-interactive shell won't reload .bashrc)
          export PATH="$PATH:$HOME/.maestro/bin"
          # And in NEXT steps
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"

          which maestro
          maestro --version

      - name: Boot emulator + install APK + run Maestro
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 33
          arch: x86_64
          target: google_apis
          ram-size: 2048M
          script: |
            set -e
            adb devices

            APK_PATH="build/app/outputs/flutter-apk/app-release.apk"
            echo "Installing APK: $APK_PATH"
            adb install -r "$APK_PATH"

            adb shell input keyevent 82 || true

            mkdir -p maestro
            maestro test --format=junit --output=maestro/report.xml --no-ansi .maestro

      - name: Publish test report
        if: always() && hashFiles('maestro/report.xml') != ''
        uses: dorny/test-reporter@v1
        with:
          name: Maestro Android
          path: maestro/report.xml
          reporter: java-junit

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: maestro-android
          path: |
            maestro/report.xml
            .maestro/**