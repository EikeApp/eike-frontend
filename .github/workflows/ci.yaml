name: Flutter CI

on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test ./packages/*

  build-apk:
    name: Build APK
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          cache: true
      - run: flutter pub get
      - run: |
          cd packages/eike_app
          flutter build apk --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-apk
          path: packages/eike_app/build/app/outputs/flutter-apk/app-release.apk

  build-appbundle:
    name: Build Appbundle
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          cache: true
      - run: flutter pub get
      - run: |
          cd packages/eike_app
          flutter build appbundle --release
      - uses: actions/upload-artifact@v4
        with:
          name: android-appbundle
          path: packages/eike_app/build/app/outputs/bundle/app-release.aab

  build-ipa:
    name: Build iOS
    needs: test
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.44.2"
          cache: true
      - run: flutter pub get
      - run: |
          cd packages/eike_app
          flutter build ios --release --no-codesign
      - run: |
          mkdir -p Payload
          cp -R packages/eike_app/build/ios/iphoneos/Runner.app Payload/
          zip -r app-release-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios-ipa
          path: app-release-unsigned.ipa
